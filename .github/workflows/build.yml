name: Build TikTokMediaDownloader

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        variant: [rootful, rootless]
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Install iOS SDK
      run: |
        curl -L -o /tmp/sdks.tar.gz https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz
        mkdir -p $THEOS/sdks
        tar -xf /tmp/sdks.tar.gz -C $THEOS/sdks
        ls $THEOS/sdks

    - name: Build (rootful)
      if: matrix.variant == 'rootful'
      run: |
        make clean
        make package FINALPACKAGE=1
        mkdir -p output/rootful
        cp -v .theos/obj/TikTokMediaDownloader.dylib output/rootful/ 2>/dev/null || true
        cp -v packages/*.deb output/rootful/ 2>/dev/null || true

    - name: Build (rootless)
      if: matrix.variant == 'rootless'
      run: |
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        mkdir -p output/rootless
        cp -v .theos/obj/TikTokMediaDownloader.dylib output/rootless/ 2>/dev/null || true
        cp -v packages/*.deb output/rootless/ 2>/dev/null || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TikTokMediaDownloader-${{ matrix.variant }}
        path: output/${{ matrix.variant }}/
        retention-days: 30
